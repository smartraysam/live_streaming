basePath: /api/v1
definitions:
  api.ErrorResponse:
    properties:
      data:
        type: string
      error:
        type: string
    type: object
  api.Response:
    properties:
      data: {}
      error:
        type: string
    type: object
  payment.TipRequest:
    properties:
      amount_usd:
        example: 5
        type: number
      message:
        example: great stream
        type: string
    type: object
  recording.IVSEvent:
    properties:
      recording_s3_key:
        example: recordings/file.mp4
        type: string
      stream_id:
        example: 1c95b9af-0f52-469b-9fa6-7d7375f26de8
        type: string
      type:
        example: Stream Start
        type: string
    type: object
  session.CreateSessionRequest:
    properties:
      description:
        example: Private mentoring
        type: string
      invited_viewer_id:
        example: user_456
        type: string
      price_usd:
        example: 20
        type: number
      title:
        example: 1:1 coaching
        type: string
    type: object
  stage.CreateStageRequest:
    properties:
      mode:
        allOf:
        - $ref: '#/definitions/stage.StageMode'
        example: CALL
      title:
        example: Private call
        type: string
    type: object
  stage.DisconnectRequest:
    properties:
      reason:
        example: host_removed
        type: string
    type: object
  stage.JoinStageRequest:
    properties:
      capabilities:
        description: Capabilities requested by this participant.  Omit to use mode
          defaults.
        items:
          $ref: '#/definitions/stage.ParticipantCapability'
        type: array
      user_id:
        description: UserID of the participant (resolved from auth when ENABLE_AUTH=true).
        example: user_456
        type: string
    type: object
  stage.ParticipantCapability:
    enum:
    - PUBLISH
    - SUBSCRIBE
    type: string
    x-enum-varnames:
    - CapabilityPublish
    - CapabilitySubscribe
  stage.StageMode:
    enum:
    - CALL
    - BROADCAST
    type: string
    x-enum-varnames:
    - StageModeCall
    - StageModeBroadcast
  stream.CreateStreamRequest:
    properties:
      description:
        example: Tonight we build together
        type: string
      invited_viewer_id:
        example: user_456
        type: string
      is_paid:
        example: true
        type: boolean
      stream_type:
        example: broadcast
        type: string
      ticket_price_usd:
        example: 5
        type: number
      title:
        example: My live show
        type: string
    type: object
  stream.UpdateStreamRequest:
    properties:
      description:
        example: Updated description
        type: string
      is_paid:
        example: false
        type: boolean
      ticket_price_usd:
        example: 0
        type: number
      title:
        example: Updated title
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Live streaming microservice - supports broadcast (1-to-many) and private
    (1-to-1) streams, live chat, tipping, and ticketed access.
  title: Livestream Service API
  version: "1.0"
paths:
  /sessions:
    post:
      consumes:
      - application/json
      description: Creates a private LOW_LATENCY stream and assigns invited viewer.
      parameters:
      - description: Session config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/session.CreateSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create private session
      tags:
      - Sessions
  /sessions/{id}/accept:
    post:
      description: Charges session fee and grants playback ticket.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accept session invite
      tags:
      - Sessions
  /sessions/{id}/decline:
    post:
      description: Marks invite as declined.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Decline session invite
      tags:
      - Sessions
  /sessions/{id}/invite:
    post:
      description: Notifies a viewer about private session invite.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Invite viewer
      tags:
      - Sessions
  /sessions/incoming:
    get:
      description: Returns pending private sessions for the viewer.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: List incoming invites
      tags:
      - Sessions
  /stages:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List stages created by the caller
      tags:
      - Stages (Real-Time)
    post:
      consumes:
      - application/json
      description: Provisions an IVS Real-Time stage. Use mode=CALL for 1-to-1, mode=BROADCAST
        for 1-to-many.
      parameters:
      - description: Stage config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stage.CreateStageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a real-time stage
      tags:
      - Stages (Real-Time)
  /stages/{id}:
    delete:
      description: Only the host can end a stage. All participants are disconnected.
      parameters:
      - description: Stage ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: End (delete) a stage
      tags:
      - Stages (Real-Time)
    get:
      parameters:
      - description: Stage ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get stage details
      tags:
      - Stages (Real-Time)
  /stages/{id}/join:
    post:
      consumes:
      - application/json
      description: Returns a short-lived WebRTC token. Pass it to IVSBroadcastClient.Stage
        on the client.
      parameters:
      - description: Stage ID
        in: path
        name: id
        required: true
        type: string
      - description: Join options
        in: body
        name: body
        schema:
          $ref: '#/definitions/stage.JoinStageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a participant token to join a stage
      tags:
      - Stages (Real-Time)
  /stages/{id}/participants/{pid}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Stage ID
        in: path
        name: id
        required: true
        type: string
      - description: Participant ID
        in: path
        name: pid
        required: true
        type: string
      - description: Reason
        in: body
        name: body
        schema:
          $ref: '#/definitions/stage.DisconnectRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Disconnect a participant (host only)
      tags:
      - Stages (Real-Time)
  /streams:
    get:
      description: Returns all broadcast streams by default. Use ?status=live for
        live-only.
      parameters:
      - description: Filter by status (live)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      summary: List streams
      tags:
      - Streams
    post:
      consumes:
      - application/json
      description: Creates an IVS channel. Set stream_type to "broadcast" for 1-to-many
        or "private" for 1-to-1.
      parameters:
      - description: Stream config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stream.CreateStreamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create stream
      tags:
      - Streams
  /streams/{id}:
    delete:
      description: Deletes IVS channel and stream metadata.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete stream
      tags:
      - Streams
    get:
      description: Returns stream metadata for the given stream id.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get stream
      tags:
      - Streams
    patch:
      consumes:
      - application/json
      description: Updates title, description, paid settings.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/stream.UpdateStreamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update stream
      tags:
      - Streams
  /streams/{id}/access:
    get:
      description: Returns whether the requesting user is allowed to watch this stream.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check stream access
      tags:
      - Streams
  /streams/{id}/chat:
    get:
      description: Upgrades HTTP to websocket and subscribes user to stream chat.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Connect chat websocket
      tags:
      - Chat
  /streams/{id}/chat/history:
    get:
      description: Returns recent chat messages for a stream.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Get chat history
      tags:
      - Chat
  /streams/{id}/ingest-info:
    get:
      description: Returns IVS ingest endpoint and stream key for OBS/RTMPS broadcasting.
        Creator only.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get ingest info
      tags:
      - Streams
  /streams/{id}/ivs-status:
    get:
      description: Returns real-time IVS channel live state for creator-owned stream.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get IVS channel status
      tags:
      - Streams
  /streams/{id}/playback:
    get:
      description: Returns signed playback URL for viewer after invite/ticket checks.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get playback URL
      tags:
      - Streams
  /streams/{id}/recording:
    get:
      description: Returns CloudFront recording URL for a stream.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get recording
      tags:
      - Recording
  /streams/{id}/start-live:
    post:
      description: Marks stream status as LIVE for creator-triggered broadcast start.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start live broadcast
      tags:
      - Streams
  /streams/{id}/stop-live:
    post:
      description: Marks stream status as ENDED for creator-triggered broadcast stop.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stop live broadcast
      tags:
      - Streams
  /streams/{id}/sync:
    post:
      description: Persists stream details (title, status, pricing, ARNs) to the Laravel
        backend.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sync stream to Laravel
      tags:
      - Streams
  /streams/{id}/ticket/purchase:
    post:
      description: Charges viewer and grants stream ticket on success.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Purchase ticket
      tags:
      - Tickets
  /streams/{id}/ticket/verify:
    get:
      description: Checks if viewer owns valid stream ticket.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: Verify ticket
      tags:
      - Tickets
  /streams/{id}/tip:
    post:
      consumes:
      - application/json
      description: Charges viewer and emits tip alert event to chat.
      parameters:
      - description: Stream ID
        in: path
        name: id
        required: true
        type: string
      - description: Tip payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/payment.TipRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send tip
      tags:
      - Payments
  /streams/creator/{creator_id}:
    get:
      description: Lists live and past streams for a creator.
      parameters:
      - description: Creator ID
        in: path
        name: creator_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      summary: List creator streams
      tags:
      - Streams
  /webhooks/ivs:
    post:
      consumes:
      - application/json
      description: Receives stream lifecycle and recording events from IVS.
      parameters:
      - description: Webhook secret
        in: header
        name: X-IVS-Secret
        required: true
        type: string
      - description: Event payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/recording.IVSEvent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: IVS webhook
      tags:
      - Recording
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
